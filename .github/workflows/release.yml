name: Build & Release

# Manual trigger only — use as a fallback when you can't build locally.
# Default flow: run `bash scripts/release_build.sh` from your Mac.
#
# Both architectures are built in a SINGLE job on purpose: electron-builder
# writes one latest-mac.yml per invocation, so building arches in separate
# jobs makes the last upload clobber the other arch's feed entries and
# breaks auto-update for half the user base.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. v0.1.16). Must already exist.'
        required: true

# contents: write — create the GitHub release and upload assets
# actions: write — dispatch the Homebrew tap workflow after publishing
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace dependencies
        run: npm run setup

      - name: Build app
        run: npm run typecheck && npm test

      - name: Package, sign & notarize (arm64 + x64)
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:release

      - name: Verify update artifacts
        run: node scripts/verify-update-artifacts.mjs --require-both-archs

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG='${{ inputs.tag }}'
          VERSION="${TAG#v}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "GLUI $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            release/GLUI-"$VERSION"*.dmg \
            release/GLUI-"$VERSION"*.zip \
            release/GLUI-"$VERSION"*.blockmap \
            release/latest-mac.yml

      - name: Validate published update feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-update-feed.mjs --tag '${{ inputs.tag }}'

      - name: Update Homebrew tap
        # Releases created with GITHUB_TOKEN don't fire the release event,
        # so the tap workflow must be dispatched explicitly from here.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update-homebrew.yml --repo "$GITHUB_REPOSITORY" -f tag='${{ inputs.tag }}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
          retention-days: 30
