name: Update Homebrew Tap

# Update the tap after a locally published release. Manual dispatch allows
# retrying a tap update for an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to the tap (e.g. v0.1.16)'
        required: true

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG='${{ inputs.tag || github.ref_name }}'
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download release DMGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release event can fire before assets finish uploading
          # Wait for the supported Apple Silicon DMG only.
          VERSION='${{ steps.version.outputs.version }}'
          for i in $(seq 1 30); do
            assets=$(gh release view "${{ steps.version.outputs.tag }}" \
              --repo "${{ github.repository }}" \
              --json assets --jq '[.assets[].name] | join(" ")' 2>/dev/null || echo '')
            if [[ "$assets" == *"GLUI-${VERSION}-arm64.dmg"* ]]; then
              break
            fi
            echo "DMGs not uploaded yet (attempt $i/30), waiting 30s..."
            sleep 30
          done
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "GLUI-${VERSION}-arm64.dmg" \
            --dir artifacts
          gh release download v0.1.17 \
            --repo "${{ github.repository }}" \
            --pattern "Clui-0.1.17.dmg" \
            --dir artifacts

      - name: Calculate SHA256 hashes
        id: sha
        run: |
          arm64_sha=$(shasum -a 256 artifacts/*-arm64.dmg | awk '{print $1}')
          intel_sha=$(shasum -a 256 artifacts/Clui-0.1.17.dmg | awk '{print $1}')
          echo "arm64=${arm64_sha}" >> "$GITHUB_OUTPUT"
          echo "intel=${intel_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-clui
        uses: actions/checkout@v5
        with:
          repository: Youssef2430/homebrew-clui
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update cask
        run: |
          cat > Casks/clui.rb << 'CASK'
          cask "clui" do
            on_arm do
              version "${{ steps.version.outputs.version }}"
              sha256 "${{ steps.sha.outputs.arm64 }}"
              url "https://github.com/Youssef2430/clui/releases/download/v#{version}/GLUI-#{version}-arm64.dmg"
              app "GLUI.app"
            end

            on_intel do
              version "0.1.17"
              sha256 "${{ steps.sha.outputs.intel }}"
              url "https://github.com/Youssef2430/clui/releases/download/v#{version}/Clui-#{version}.dmg"
              app "Clui.app"
              caveats "Intel support is deprecated. Clui v0.1.17 is the final Intel release."
            end

            name "GLUI"
            desc "Desktop UI for Claude Code, Codex, and OpenCode"
            homepage "https://github.com/Youssef2430/clui"

            depends_on macos: ">= :ventura"

            zap trash: [
              "~/Library/Application Support/clui",
              "~/Library/Preferences/com.clui.app.plist",
              "~/Library/Caches/com.clui.app",
            ]
          end
          CASK
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Casks/clui.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/clui.rb
          if git diff --staged --quiet; then
            echo "Cask already up to date — nothing to commit"
          else
            git commit -m "update clui to ${{ steps.version.outputs.version }}"
            git push
          fi
