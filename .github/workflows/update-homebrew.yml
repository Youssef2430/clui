name: Update Homebrew Tap

# Two triggers on purpose:
#  - release published: covers releases made locally via release_build.sh
#  - workflow_dispatch: covers releases made by the release.yml workflow,
#    whose GITHUB_TOKEN-created release does NOT fire the release event
#    (GitHub anti-recursion rule), so release.yml dispatches this directly.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to the tap (e.g. v0.1.16)'
        required: true

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG='${{ inputs.tag || github.ref_name }}'
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download release DMGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release event can fire before assets finish uploading
          # (release_build.sh creates the release first, then uploads).
          # Wait until both arch DMGs for this version exist.
          VERSION='${{ steps.version.outputs.version }}'
          for i in $(seq 1 30); do
            assets=$(gh release view "${{ steps.version.outputs.tag }}" \
              --repo "${{ github.repository }}" \
              --json assets --jq '[.assets[].name] | join(" ")' 2>/dev/null || echo '')
            if [[ "$assets" == *"Clui-${VERSION}-arm64.dmg"* && "$assets" == *"Clui-${VERSION}.dmg"* ]]; then
              break
            fi
            echo "DMGs not uploaded yet (attempt $i/30), waiting 30s..."
            sleep 30
          done
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.dmg" \
            --dir artifacts

      - name: Calculate SHA256 hashes
        id: sha
        run: |
          arm64_sha=$(shasum -a 256 artifacts/*-arm64.dmg | awk '{print $1}')
          intel_sha=$(shasum -a 256 artifacts/Clui-${{ steps.version.outputs.version }}.dmg | awk '{print $1}')
          echo "arm64=${arm64_sha}" >> "$GITHUB_OUTPUT"
          echo "intel=${intel_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-clui
        uses: actions/checkout@v5
        with:
          repository: Youssef2430/homebrew-clui
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update cask
        run: |
          cat > Casks/clui.rb << 'CASK'
          cask "clui" do
            arch arm: "arm64", intel: ""
            folder = on_arch_conditional arm: "-arm64", intel: ""

            version "${{ steps.version.outputs.version }}"
            sha256 arm:   "${{ steps.sha.outputs.arm64 }}",
                   intel: "${{ steps.sha.outputs.intel }}"

            url "https://github.com/Youssef2430/clui/releases/download/v#{version}/Clui-#{version}#{folder}.dmg"
            name "Clui"
            desc "Desktop UI for Claude Code"
            homepage "https://github.com/Youssef2430/clui"

            depends_on macos: ">= :ventura"

            app "Clui.app"

            zap trash: [
              "~/Library/Application Support/Clui",
              "~/Library/Preferences/com.clui.app.plist",
              "~/Library/Caches/com.clui.app",
            ]
          end
          CASK
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Casks/clui.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/clui.rb
          if git diff --staged --quiet; then
            echo "Cask already up to date — nothing to commit"
          else
            git commit -m "update clui to ${{ steps.version.outputs.version }}"
            git push
          fi
