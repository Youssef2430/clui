name: Update Feed Check

# Validate the published GitHub update feed that installed apps poll.
# Building, packaging, and publishing releases are performed locally.

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1' # weekly Monday 06:23 UTC
  workflow_dispatch:

jobs:
  verify-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate published update feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-update-feed.mjs
