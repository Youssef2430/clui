name: Update Feature Check

# Keeps the auto-update pipeline honest:
#  - verify-packaging: packages the app (unsigned) and asserts the updater
#    artifacts (app-update.yml, latest-mac.yml, zip target) are produced and
#    internally consistent, so a config change can't silently break updates.
#  - verify-feed: validates the *published* GitHub feed that shipped apps
#    poll, so a botched release upload is caught quickly.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1' # weekly Monday 06:23 UTC
  workflow_dispatch:

jobs:
  verify-packaging:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npx electron-vite build --mode production

      - name: Package (unsigned, zip only, arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac zip --arm64 -c.mac.notarize=false --publish never

      - name: Verify updater wiring survived the bundle
        run: |
          grep -q 'checkForUpdates' dist/main/index.js || {
            echo '::error::dist/main/index.js no longer calls checkForUpdates — auto-updater wiring was removed'
            exit 1
          }

      - name: Verify update artifacts
        run: node scripts/verify-update-artifacts.mjs

  verify-feed:
    # The published feed is independent of PR contents — don't block PRs on it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate published update feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-update-feed.mjs
